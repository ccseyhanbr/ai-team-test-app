schema_version = 1

[project]
id = "ai-team-test-app"
name = "AI Team Test App"
github_repository = "ccseyhanbr/ai-team-test-app"
default_branch = "main"

[issues]
enabled = true
execution_label = "team:ready"
pause_label = "team:paused"

[paths]
frontend = "."
backend = "."
tests = "tests"

[commands]
setup = "npm install"
test = "npm test"
build = "npm run build"

[context]
files = [
  "README.md"
]

[browser_testing]
enabled = false

[capabilities]
docker_required = false
database_required = false
external_services_required = false
